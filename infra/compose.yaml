name: bitos-native

services:
  postgres:
    image: postgres:17.9-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitos}
      POSTGRES_USER: ${POSTGRES_USER:-bitos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bitos-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-change-me-now}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - object-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../services/platform
    environment:
      BITOS_ENV: ${BITOS_ENV:-local}
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-bitos}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-bitos}
      CACHE_URL: redis://valkey:6379
      OBJECT_ENDPOINT: http://object-store:9000
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      object-store: { condition: service_healthy }

  indexer:
    build:
      context: ../services/platform
    command: ['node', '--experimental-strip-types', 'src/indexer.ts']
    environment:
      BITOS_ENV: ${BITOS_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-bitos}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-bitos}
      CACHE_URL: redis://valkey:6379
      RELAY_URLS: ws://nostr-relay:8080
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  worker:
    build:
      context: ../services/platform
    command: ['node', '--experimental-strip-types', 'src/worker.ts']
    environment:
      BITOS_ENV: ${BITOS_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-bitos}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-bitos}
      CACHE_URL: redis://valkey:6379
      OBJECT_ENDPOINT: http://object-store:9000
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      object-store: { condition: service_healthy }

  nostr-relay:
    profiles: ['nostr']
    image: ${NOSTR_RELAY_IMAGE:-scsibug/nostr-rs-relay:latest}
    ports:
      - '127.0.0.1:7000:8080'
    volumes:
      - relay-data:/usr/src/app/db
      - ./nostr-relay/config.toml:/usr/src/app/config.toml:ro

  blossom:
    profiles: ['blossom']
    build:
      context: ${BLOSSOM_SERVER_CONTEXT:-../vendor/blossom-server}
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-bitos-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-only-change-me-now}
    volumes:
      - ./blossom/config.yml:/app/config.yml:ro
    depends_on:
      object-store: { condition: service_healthy }

volumes:
  postgres-data:
  object-data:
  relay-data:
